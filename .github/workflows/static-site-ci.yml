name: Static site CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate brand site
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check export script syntax
        run: |
          node --check docs/assets/logo-export-studio.js
          node --check docs/assets/gif-encoder.js
          node --check docs/assets/logo-motion-export.js

      - name: Validate static pages and assets
        run: node scripts/validate-static-site.mjs
